spring.application.name=order-service

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1522/XEPDB1}
spring.datasource.username=Food_Order
spring.datasource.password=${DB_PASSWORD:Ab@123456}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8082

# JWT Configuration (must match users-service)
jwt.secret=${JWT_SECRET:9B9A6B29C5B726C748C6B6F55DADC5F3C2C9BAF9489AECA17BDE99EBD69153C4}
jwt.expiration=86400000

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Table Service URL (internal service call)
table.service.url=${TABLE_SERVICE_URL:http://localhost:8083}
catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8081}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}

# Actuator & Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
